<!doctype html>
<!-- Source for .github/assets/banner.jpg (README) and social-preview.jpg (repository card).
     Render: node scripts/render-github-art.js -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Geist;src:url(../Resources/Fonts/Geist-SemiBold.ttf);font-weight:600}
@font-face{font-family:Geist;src:url(../Resources/Fonts/Geist-Medium.ttf);font-weight:500}
@font-face{font-family:Geist;src:url(../Resources/Fonts/Geist-Bold.ttf);font-weight:700}
html,body{margin:0;width:1280px;height:640px;background:transparent;overflow:hidden;font-family:Geist;-webkit-font-smoothing:antialiased}
.card{position:absolute;inset:0;overflow:hidden;background:url(../site/hero-sky.webp) center 20%/cover,#87a6f6}
.wrap{position:absolute;left:0;right:0;top:70px;text-align:center}
.icon{width:104px;height:104px;filter:drop-shadow(0 18px 24px rgba(30,45,110,.3))}
h1{margin:26px 0 0;font-weight:600;font-size:66px;line-height:1;letter-spacing:-.045em;color:#111218}
p{margin:18px 0 0;font-weight:500;font-size:23px;letter-spacing:-.015em;color:#262832}
.tray{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);display:flex;gap:10px;padding:10px;border-radius:22px;
  background:rgba(22,24,32,.42);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 24px 44px -20px rgba(20,25,70,.55);backdrop-filter:blur(20px)}
.t{position:relative;width:168px;height:104px;border-radius:13px;background-size:cover;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.t.on{box-shadow:0 0 0 3px #4087ff}
.t b{position:absolute;left:7px;top:7px;width:22px;height:22px;border-radius:50%;background:#4087ff;color:#fff;font:700 12px Geist;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
</style></head><body>
<div class="card">
  <div class="wrap">
    <img class="icon" src="../site/peek-icon.png" alt="">
    <h1>The screenshot app<br>your Mac deserves</h1>
    <p>Free and open source. Every screenshot, straight to your clipboard.</p>
  </div>
  <div class="tray">
    <div class="t on" style="background-image:url(../site/flow-sky.webp)"><b>1</b></div>
    <div class="t on" style="background-image:url(../site/keys-sky.webp)"><b>2</b></div>
    <div class="t on" style="background-image:url(../site/wallpaper.webp)"><b>3</b></div>
  </div>
</div>
</body></html>
